[package]
name = "clipferry"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "A native Windows LAN file clipboard"
repository = "https://github.com/micky-meecky/ClipFerry"

[dependencies]
getrandom = "0.3.4"
rcgen = { version = "0.14.9", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std"] }
sha2 = "0.10.9"
zeroize = "1.9.0"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62.2"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
